; llama.cpp router presets: one section per model. The section name is the model id
; Llamastat shows (and the `model` field in OpenAI/Anthropic requests).
; `metrics = 1` enables /metrics, which Llamastat needs for token stats.
; __MODELS__ is replaced with your models folder by the install scripts.

[Qwen3-8B]
model = __MODELS__/Qwen3-8B-Q4_K_M.gguf
ctx-size = 32768
n-gpu-layers = 999
jinja = 1
metrics = 1

; [gpt-oss-20b]
; model = __MODELS__/gpt-oss-20b-MXFP4.gguf
; ctx-size = 32768
; n-gpu-layers = 999
; jinja = 1
; metrics = 1
