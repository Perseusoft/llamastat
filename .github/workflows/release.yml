name: Release

# Push a tag like v0.2.0 (or run manually) to build installers for every platform.
# Artifacts go to a draft GitHub Release and, if the R2 secrets are set, to Cloudflare R2.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            runner: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - name: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - name: windows-arm64
            runner: windows-latest
            target: aarch64-pc-windows-msvc
            # MSI (WiX) can't target ARM64; NSIS can.
            bundles: --bundles nsis
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets || matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          key: ${{ matrix.target }}
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
        working-directory: app

      # Optional macOS signing/notarization (see docs/RELEASE.md). Only exported when the secrets exist:
      # tauri tries to import the certificate as soon as APPLE_CERTIFICATE is set, even if it's empty,
      # and the build dies with "failed to import keychain certificate".
      - name: macOS signing secrets
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then
              { echo "$v<<__EOF__"; echo "${!v}"; echo "__EOF__"; } >> "$GITHUB_ENV"
              echo "$v: set"
            else
              echo "$v: not set"
            fi
          done
          [ -n "$APPLE_CERTIFICATE" ] || echo "No certificate: the .dmg will be unsigned."

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          args: --target ${{ matrix.target }} ${{ matrix.bundles }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Llamastat ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist-upload
          bundle="app/src-tauri/target/${{ matrix.target }}/release/bundle"
          find "$bundle" -maxdepth 2 -type f \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.deb' -o -name '*.rpm' \
            -o -name '*.AppImage' -o -name '*.msi' -o -name '*-setup.exe' \) -exec cp {} dist-upload/ \;
          ls -la dist-upload
      - uses: actions/upload-artifact@v5
        with:
          name: llamastat-${{ matrix.name }}
          path: dist-upload/*

  # Mirrors the installers to Cloudflare R2 (the same bucket/domain Astral uses, under its own prefix):
  #   llamastat-releases/<version>/   versioned files
  #   llamastat-releases/latest/      same files without the version (stable download links)
  #   llamastat-releases/latest.json  manifest read by the download page
  r2:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ vars.R2_BUCKET != '' }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ vars.R2_BUCKET }}
          PREFIX: ${{ vars.R2_PREFIX || 'llamastat-releases' }}
          PUBLIC_URL: ${{ vars.R2_PUBLIC_URL || 'https://downloads.perseusoft.tech' }}
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.run_number) }}
        run: |
          ls -la artifacts
          count=$(find artifacts -type f | wc -l)
          [ "$count" -gt 0 ] || { echo "::error::no installers to upload"; exit 1; }
          # Force a download instead of an inline preview, whatever the browser sniffs.
          for f in artifacts/*; do
            aws s3 cp "$f" "s3://$BUCKET/$PREFIX/$VERSION/$(basename "$f")" --endpoint-url "$ENDPOINT" \
              --content-disposition "attachment; filename=\"$(basename "$f")\""
          done
          if [[ "$VERSION" == v* ]]; then
            # Stable names for download links: drop the version from file names.
            mkdir latest
            for f in artifacts/*; do
              name=$(basename "$f" | sed -E -e 's/_[0-9]+\.[0-9]+\.[0-9]+//' -e 's/-[0-9]+\.[0-9]+\.[0-9]+-[0-9]+//')
              cp "$f" "latest/$name"
            done
            for f in latest/*; do
              aws s3 cp "$f" "s3://$BUCKET/$PREFIX/latest/$(basename "$f")" --endpoint-url "$ENDPOINT" \
                --content-disposition "attachment; filename=\"$(basename "$f")\""
            done
            # Manifest for the download page: version, date and one URL per installer.
            python3 - <<'PY' > latest.json
          import json, os, datetime
          base = f"{os.environ['PUBLIC_URL']}/{os.environ['PREFIX']}/{os.environ['VERSION']}"
          files = sorted(os.listdir("artifacts"))
          def pick(*parts):
              for f in files:
                  if all(p in f for p in parts): return f"{base}/{f}"
          assets = {
              "macos_universal_dmg": pick("universal", ".dmg"),
              "windows_x64_exe": pick("x64-setup.exe"), "windows_x64_msi": pick("x64", ".msi"),
              "windows_arm64_exe": pick("arm64-setup.exe"),
              "linux_x64_appimage": pick("amd64.AppImage"), "linux_x64_deb": pick("amd64.deb"), "linux_x64_rpm": pick("x86_64.rpm"),
              "linux_arm64_appimage": pick("aarch64.AppImage"), "linux_arm64_deb": pick("arm64.deb"), "linux_arm64_rpm": pick("aarch64.rpm"),
          }
          print(json.dumps({
              "version": os.environ["VERSION"],
              "date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "base_url": base,
              "files": [f"{base}/{f}" for f in files],
              "assets": {k: v for k, v in assets.items() if v},
          }, indent=2))
          PY
            cat latest.json
            aws s3 cp latest.json "s3://$BUCKET/$PREFIX/latest.json" --endpoint-url "$ENDPOINT" \
              --content-type application/json --cache-control "max-age=300"
          fi
